<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Binsparse has moved</title>
    <script>
      const oldBase = "/binsparse-specification";
      const path = location.pathname.startsWith(oldBase)
        ? location.pathname.slice(oldBase.length)
        : location.pathname;
      location.replace(`https://binsparse.org${path}${location.search}${location.hash}`);
    </script>
  </head>
  <body>
    <p>
      The Binsparse website has moved to
      <a href="https://binsparse.org/">binsparse.org</a>.
    </p>
  </body>
</html>
